spring.application.name=yolka-api
server.port=${PORT:8080}

# Importar archivos de entorno locales (ignorados por Git)
spring.config.import=optional:file:./atlas-credentials.env[.properties],optional:file:../atlas-credentials.env[.properties],optional:file:./.env[.properties],optional:file:../.env[.properties]

# MongoDB Atlas y Creación Automática de Índices
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGO_DB_NAME:yolka_db}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGO_DB_NAME:yolka_db}
spring.data.mongodb.auto-index-creation=true
spring.mongodb.auto-index-creation=true

# Configuración SMTP (MailService)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
